<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>prodProcess</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studio">
<meta name="theme-color" content="#0e0e10">
<style>
  :root {
    --bg: #0e0e10; --card: #18181b; --line: #27272a; --text: #f4f4f5; --dim: #a1a1aa;
    --accent: #f97316; --ok: #22c55e; --bad: #ef4444; --wait: #eab308;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 32px); }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; min-height: 40px; }
  h1 { font-size: 24px; margin: 0; letter-spacing: -0.02em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 24px 0 8px; font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .stack > * + * { margin-top: 10px; }
  label { display: block; font-size: 14px; color: var(--dim); margin-bottom: 6px; }
  input[type=text], input[type=password], textarea {
    width: 100%; background: #0b0b0d; color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; font: inherit; font-size: 16px; }
  textarea { min-height: 120px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  button, .btn { appearance: none; border: 0; border-radius: 12px; padding: 14px 16px; font: inherit;
    font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; text-decoration: none; }
  .primary { background: var(--accent); color: #111; width: 100%; font-size: 17px; }
  .primary:disabled { opacity: .45; }
  .ghost { background: #232326; color: var(--text); }
  .small { padding: 8px 12px; font-size: 14px; border-radius: 10px; }
  .danger { background: transparent; color: var(--bad); }
  .back { background: none; color: var(--accent); padding: 8px 0; font-weight: 600; }
  .pick { border: 1.5px dashed #3f3f46; border-radius: 14px; padding: 22px 14px; text-align: center;
    color: var(--dim); display: block; cursor: pointer; }
  .pick strong { color: var(--text); display: block; font-size: 17px; margin-bottom: 2px; }
  .pick input { display: none; }
  .file { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .file:first-child { border-top: 0; }
  .file .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .size { color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .x { background: none; color: var(--dim); padding: 0 4px; font-size: 18px; line-height: 1; }
  .job { display: block; color: inherit; text-decoration: none; }
  .job + .job { margin-top: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--dim); font-size: 14px; }
  .chip { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; white-space: nowrap;
    background: #27272a; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
  .chip.done { background: rgba(34,197,94,.15); color: var(--ok); }
  .chip.failed { background: rgba(239,68,68,.15); color: var(--bad); }
  .chip.busy { background: rgba(234,179,8,.15); color: var(--wait); }
  .chip.busy::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; margin-right: 6px; vertical-align: 1px; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .bar { height: 8px; background: #27272a; border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .progress-text { display: flex; justify-content: space-between; font-size: 14px; color: var(--dim);
    margin-top: 6px; font-variant-numeric: tabular-nums; }
  video { width: 100%; border-radius: 12px; background: #000; display: block; }
  .note { white-space: pre-wrap; font-size: 15px; }
  .empty { text-align: center; color: var(--dim); padding: 40px 10px; }
  .err { color: var(--bad); font-size: 14px; margin-top: 8px; }
  .hint { color: var(--dim); font-size: 13px; margin-top: 8px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .actions > * { flex: 1; }
  .livebox { padding: 0; overflow: hidden; }
  .livebox summary { list-style: none; cursor: pointer; padding: 14px; display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .livebox summary::-webkit-details-marker { display: none; }
  .livebox summary .meta { margin-left: auto; font-weight: 400; }
  .livebox summary::after { content: "▾"; color: var(--dim); }
  .livebox[open] summary::after { content: "▴"; }
  .livedot { color: var(--accent); animation: pulse 1.6s infinite; }
  .feed { max-height: 380px; overflow-y: auto; border-top: 1px solid var(--line); padding: 8px 14px 12px;
    font-size: 14px; overscroll-behavior: contain; }
  .f { display: flex; gap: 10px; padding: 5px 0; }
  .f-t { color: #52525b; font-size: 12px; min-width: 56px; padding-top: 2px; font-variant-numeric: tabular-nums; }
  .f-x { flex: 1; white-space: pre-wrap; word-break: break-word; }
  .f-do .f-x { color: var(--dim); }
  .f-do .f-x::before { content: "› "; color: var(--accent); }
  .f-sys .f-x { color: #71717a; font-style: italic; }
  .f-run { text-align: center; color: #52525b; font-size: 12px; margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .06em; }
  .f-img img { display: block; width: 100%; max-width: 360px; border-radius: 8px; border: 1px solid var(--line); background: #000; }
  .f-img .cap { display: block; color: #71717a; font-size: 12px; margin-top: 4px; }
  .review { margin-top: 14px; }
  .noterow { display: flex; gap: 8px; align-items: center; }
  .ts { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 700; font-size: 14px; }
  button.ts { background: none; padding: 0 4px 0 0; border-radius: 0; }
  .earlier { margin-top: 14px; }
  .earlier summary { cursor: pointer; font-weight: 600; }
  .ver { margin-top: 12px; }
  .ver video { margin: 6px 0 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const PART = 50 * 1024 * 1024; // must match for every part except the last
const BUSY = ["ready", "downloading", "editing", "sending"];
const LABEL = { uploading: "Sending", ready: "Queued", downloading: "To PC", editing: "Editing",
  sending: "Returning", done: "Done", failed: "Failed" };
const app = document.getElementById("app");
let pollTimer = null;
let liveTimer = null;
let draft = { title: "", note: "", files: [] };
let sending = false;

// ---------- api ----------
async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: "same-origin", ...opts,
    headers: opts.body && !(opts.body instanceof Blob) ? { "content-type": "application/json", ...(opts.headers || {}) } : opts.headers });
  if (res.status === 401 && path !== "/api/login") { route("#/login"); throw new Error("Not signed in"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
  return data;
}

// ---------- helpers ----------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function size(n) {
  if (!n) return "0 MB";
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
  if (n < 1024 ** 3) return (n / 1024 / 1024).toFixed(n < 10 * 1024 * 1024 ? 1 : 0) + " MB";
  return (n / 1024 ** 3).toFixed(2) + " GB";
}
function ago(t) {
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
const chip = (st) => `<span class="chip ${st === "done" ? "done" : st === "failed" ? "failed" : BUSY.includes(st) || st === "uploading" ? "busy" : ""}">${LABEL[st] || st}</span>`;
function route(h) { if (location.hash !== h) location.hash = h; else render(); }
function stopPoll() { clearTimeout(pollTimer); clearTimeout(liveTimer); pollTimer = liveTimer = null; }

// ---------- views ----------
async function render() {
  stopPoll();
  const h = location.hash || "#/";
  if (h === "#/login") return viewLogin();
  if (h === "#/new") return viewNew();
  const m = h.match(/^#\/job\/([a-z0-9-]+)$/);
  if (m) return viewJob(m[1]);
  return viewList();
}

function viewLogin() {
  app.innerHTML = `
    <header><h1>prodProcess</h1></header>
    <div class="card stack">
      <div><label for="code">Access code</label>
      <input id="code" type="text" inputmode="text" placeholder="xxxx-xxxx" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
        style="font-size:22px;letter-spacing:.12em;text-align:center"></div>
      <button class="primary" id="go">Sign in</button>
      <div class="err" id="err" hidden></div>
    </div>`;
  const go = async () => {
    try {
      await api("/api/login", { method: "POST", body: JSON.stringify({ token: document.getElementById("code").value }) });
      route("#/");
    } catch (e) { const el = document.getElementById("err"); el.textContent = e.message; el.hidden = false; }
  };
  document.getElementById("go").onclick = go;
  // Must not return false here: an on* handler returning false cancels the keystroke.
  document.getElementById("code").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
}

async function viewList() {
  app.innerHTML = `
    <header><h1>Jobs</h1></header>
    <a class="btn primary" href="#/new">＋ New job</a>
    <h2>Recent</h2>
    <div id="jobs"><div class="empty">Loading…</div></div>`;
  const load = async () => {
    let jobs;
    try { ({ jobs } = await api("/api/jobs")); } catch { return; }
    if (location.hash && location.hash !== "#/") return;
    const el = document.getElementById("jobs");
    el.innerHTML = jobs.length ? jobs.map((j) => `
      <a class="card job" href="#/job/${j.id}">
        <div class="row"><div class="title">${esc(j.title)}</div>${chip(j.status)}</div>
        <div class="meta">${ago(j.created)}${j.status === "failed" && j.message ? " · " + esc(j.message.slice(0, 60)) : ""}</div>
      </a>`).join("") : `<div class="empty">No jobs yet. Tap <b>New job</b> to send footage.</div>`;
    if (jobs.some((j) => BUSY.includes(j.status))) pollTimer = setTimeout(load, 6000);
  };
  load();
}

function viewNew() {
  app.innerHTML = `
    <header><button class="back" onclick="history.back()">‹ Jobs</button></header>
    <h1>New job</h1>
    <div class="stack" style="margin-top:16px">
      <div><label for="title">Name</label>
        <input id="title" type="text" placeholder="e.g. Basketball — older vs younger" value="${esc(draft.title)}"></div>
      <div><label for="note">What do you want?</label>
        <textarea id="note" placeholder="e.g. 2–3 min recap, upbeat music, use my voice memo as the voiceover, captions on.">${esc(draft.note)}</textarea></div>
      <label class="pick"><input id="pick" type="file" multiple accept="video/*,audio/*,image/*,.m4a,.mp3,.wav,.mov,.mp4">
        <strong>＋ Add clips &amp; audio</strong>Videos, voice memos, photos</label>
      <div class="card" id="list" hidden></div>
      <div id="prog" hidden><div class="bar"><i id="barfill"></i></div>
        <div class="progress-text"><span id="ptext"></span><span id="ppct"></span></div>
        <div class="hint">Keep this screen open until it says sent.</div></div>
      <button class="primary" id="send">Send to PC</button>
      <div class="err" id="err" hidden></div>
    </div>`;
  const $ = (id) => document.getElementById(id);
  $("title").oninput = (e) => (draft.title = e.target.value);
  $("note").oninput = (e) => (draft.note = e.target.value);
  $("pick").onchange = (e) => { draft.files.push(...e.target.files); e.target.value = ""; drawFiles(); };
  $("send").onclick = send;
  drawFiles();
}

function drawFiles() {
  const list = document.getElementById("list");
  const btn = document.getElementById("send");
  if (!list) return;
  list.hidden = !draft.files.length;
  const total = draft.files.reduce((a, f) => a + f.size, 0);
  list.innerHTML = draft.files.map((f, i) => `
    <div class="file"><span class="name">${esc(f.name)}</span>
      <span><span class="size">${size(f.size)}</span>${sending ? "" : ` <button class="x" data-i="${i}" aria-label="Remove">×</button>`}</span></div>`).join("")
    + (draft.files.length > 1 ? `<div class="file"><span class="name meta">${draft.files.length} files</span><span class="size">${size(total)}</span></div>` : "");
  list.querySelectorAll(".x").forEach((b) => (b.onclick = () => { draft.files.splice(+b.dataset.i, 1); drawFiles(); }));
  btn.disabled = sending || !draft.files.length;
}

async function send() {
  const $ = (id) => document.getElementById(id);
  const err = $("err");
  err.hidden = true;
  if (!draft.files.length) return;
  sending = true; drawFiles();
  $("send").textContent = "Sending…";
  $("prog").hidden = false;
  let lock = null;
  try { lock = await navigator.wakeLock?.request("screen"); } catch {}

  try {
    // Reuse the job if a previous attempt failed part-way, skipping files already up.
    if (!draft.jobId) {
      const job = await api("/api/jobs", { method: "POST", body: JSON.stringify({ title: draft.title, note: draft.note }) });
      draft.jobId = job.id;
      draft.doneIdx = new Set();
    }
    await uploadAll(draft, (p) => {
      $("barfill").style.width = p.pct + "%";
      $("ptext").textContent = `${p.filesDone} of ${p.files} files${p.speed ? ` · ${p.speed}` : ""}`;
      $("ppct").textContent = `${size(p.sent)} / ${size(p.total)}`;
    });
    await api(`/api/jobs/${draft.jobId}/status`, { method: "POST", body: JSON.stringify({ status: "ready" }) });
    const id = draft.jobId;
    draft = { title: "", note: "", files: [] };
    sending = false;
    route(`#/job/${id}`);
  } catch (e) {
    sending = false;
    err.textContent = `Stopped: ${e.message}. Tap Send to carry on — finished files won't resend.`;
    err.hidden = false;
    $("send").textContent = "Send to PC";
    drawFiles();
  } finally {
    lock?.release?.().catch(() => {});
  }
}

// Sends every file as 50 MB parts, LANES parts at a time across all files, so the
// connection never sits idle between parts. Each file is finished as soon as its parts are in.
const LANES = 4;

async function uploadAll(d, onProgress) {
  const jobId = d.jobId;
  const todo = d.files.map((f, i) => i).filter((i) => !d.doneIdx.has(i));
  const total = d.files.reduce((a, f) => a + f.size, 0);
  let doneBytes = d.files.reduce((a, f, i) => a + (d.doneIdx.has(i) ? f.size : 0), 0);
  const inflight = new Map();
  const state = new Map(); // file index -> { meta, left, parts }
  const tasks = [];
  for (const i of todo) {
    const f = d.files[i];
    const count = Math.max(1, Math.ceil(f.size / PART));
    state.set(i, { meta: null, left: count, parts: [] });
    for (let n = 1; n <= count; n++) tasks.push({ i, n, start: (n - 1) * PART, end: Math.min(n * PART, f.size) });
  }

  let speed = "", lastBytes = doneBytes, lastT = performance.now(), rate = 0;
  const report = () => {
    const sent = doneBytes + [...inflight.values()].reduce((a, b) => a + b, 0);
    const now = performance.now();
    if (now - lastT > 1000) {
      const r = (sent - lastBytes) / ((now - lastT) / 1000);
      rate = rate ? rate * 0.7 + r * 0.3 : r;
      lastBytes = sent; lastT = now;
      speed = rate > 0 ? `${(rate / 1048576).toFixed(1)} MB/s` : "";
    }
    onProgress({ sent, total, pct: total ? Math.min(100, (sent / total) * 100) : 100, filesDone: d.doneIdx.size, files: d.files.length, speed });
  };
  const ticker = setInterval(report, 500);

  const metaFor = (i) => {
    const st = state.get(i);
    if (!st.meta) {
      const f = d.files[i];
      st.meta = api(`/api/jobs/${jobId}/files`, { method: "POST",
        body: JSON.stringify({ name: f.name, size: f.size, type: f.type || "application/octet-stream", role: "input" }) });
    }
    return st.meta;
  };

  let next = 0, failed = null;
  const lane = async () => {
    while (!failed && next < tasks.length) {
      const t = tasks[next++];
      const key = `${t.i}:${t.n}`;
      try {
        const meta = await metaFor(t.i);
        const blob = d.files[t.i].slice(t.start, t.end);
        const part = await putPart(`/api/jobs/${jobId}/files/${meta.id}/parts/${t.n}`, blob, (loaded) => inflight.set(key, loaded));
        inflight.delete(key);
        doneBytes += blob.size;
        const st = state.get(t.i);
        st.parts.push(part);
        if (--st.left === 0) {
          st.parts.sort((a, b) => a.partNumber - b.partNumber);
          for (let attempt = 0; ; attempt++) {
            try {
              await api(`/api/jobs/${jobId}/files/${meta.id}/complete`, { method: "POST", body: JSON.stringify({ parts: st.parts }) });
              break;
            } catch (e) {
              if (attempt >= 4) throw e;
              await new Promise((r) => setTimeout(r, 1500 * (attempt + 1)));
            }
          }
          d.doneIdx.add(t.i);
        }
      } catch (e) {
        inflight.delete(key);
        failed = failed || e;
      }
    }
  };
  try {
    await Promise.all(Array.from({ length: LANES }, lane));
  } finally {
    clearInterval(ticker);
  }
  if (failed) throw failed;
  report();
}

// One part over XHR (fetch can't report upload progress), retried with backoff.
async function putPart(url, blob, onLoaded) {
  let lastErr;
  for (let attempt = 0; attempt < 5; attempt++) {
    try {
      return await new Promise((resolve, reject) => {
        const x = new XMLHttpRequest();
        x.open("PUT", url);
        x.upload.onprogress = (e) => onLoaded(e.loaded);
        x.onload = () => {
          let body = {};
          try { body = JSON.parse(x.responseText); } catch {}
          x.status >= 200 && x.status < 300 ? resolve(body) : reject(new Error(body.error || `Upload error ${x.status}`));
        };
        x.onerror = () => reject(new Error("Connection dropped"));
        x.send(blob);
      });
    } catch (e) {
      lastErr = e;
      onLoaded(0);
      await new Promise((r) => setTimeout(r, 1500 * (attempt + 1)));
    }
  }
  throw lastErr;
}

async function viewJob(id) {
  app.innerHTML = `<header><a class="back" href="#/">‹ Jobs</a></header>
    <div id="top"><div class="empty">Loading…</div></div>
    <details id="live" class="card livebox" hidden><summary><span id="liveTitle">Live</span><span class="meta" id="liveCount"></span></summary>
      <div class="feed" id="feed"></div></details>
    <div id="bottom"></div>`;
  let status = null, lastSeq = 0, steps = 0;
  const revDraft = { notes: [], general: "" }; // survives re-renders

  const loadFeed = async () => {
    clearTimeout(liveTimer);
    let data;
    try { data = await api(`/api/jobs/${id}/activity?after=${lastSeq}`); } catch { return; }
    if (location.hash !== `#/job/${id}`) return;
    const box = document.getElementById("live"), feed = document.getElementById("feed");
    if (data.entries.length) {
      const atEnd = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
      feed.insertAdjacentHTML("beforeend", data.entries.map((e) => feedLine(e, id)).join(""));
      steps += data.entries.filter((e) => e.k === "do").length;
      lastSeq = data.seq;
      if (atEnd || box.dataset.fresh) feed.scrollTop = feed.scrollHeight;
      delete box.dataset.fresh;
    }
    box.hidden = !lastSeq;
    const live = status === "editing" || status === "sending";
    const title = document.getElementById("liveTitle");
    title.textContent = live ? "● Live — what Claude is doing" : "What Claude did";
    title.className = live ? "livedot" : "";
    document.getElementById("liveCount").textContent = steps ? `${steps} step${steps === 1 ? "" : "s"}` : "";
    if (BUSY.includes(status)) liveTimer = setTimeout(loadFeed, 3000);
  };

  const load = async () => {
    let job;
    try { job = await api(`/api/jobs/${id}`); } catch (e) {
      const t = document.getElementById("top"); if (t) t.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return;
    }
    if (location.hash !== `#/job/${id}`) return;
    const first = status === null;
    const changed = status !== job.status;
    status = job.status;
    const box = document.getElementById("live");
    if (first) { box.open = BUSY.includes(status); box.dataset.fresh = "1"; }
    else if (changed && status === "editing") box.open = true;
    if (first || changed) loadFeed();

    const inputs = job.files.filter((f) => f.role === "input");
    const outputs = job.files.filter((f) => f.role === "output" && f.done);
    const videos = outputs.filter((f) => /\.(mp4|mov|m4v)$/i.test(f.name)).sort((a, b) => b.created - a.created);
    const others = outputs.filter((f) => !videos.includes(f));
    const fileUrl = (f) => `/api/jobs/${id}/files/${f.id}`;
    const step = { uploading: "Still sending from the phone.", ready: "Waiting for the PC to pick it up.",
      downloading: "PC is downloading the footage.", editing: "Claude is editing.", sending: "Sending the finished video back." }[job.status];
    const top = document.getElementById("top");
    const playing = top.querySelector("video");
    if (playing && !playing.paused) { pollTimer = setTimeout(load, 6000); return; } // don't reset a playing video
    top.innerHTML = `
      <div class="row"><h1 style="font-size:22px">${esc(job.title)}</h1>${chip(job.status)}</div>
      <div class="meta">${ago(job.created)}</div>
      ${step ? `<div class="card" style="margin-top:14px">${step}${job.message ? `<div class="meta">${esc(job.message)}</div>` : ""}</div>` : ""}
      ${job.status === "failed" ? `<div class="card" style="margin-top:14px"><div class="err" style="margin:0">${esc(job.message || "Something went wrong.")}</div>
        <button class="ghost small" id="retry" style="margin-top:10px">Try again</button></div>` : ""}
      ${videos.length ? `<h2>${videos.length > 1 ? `Latest · version ${videos.length}` : "Finished"}</h2>
        <video id="mainVideo" src="${fileUrl(videos[0])}" controls playsinline preload="metadata"></video>
        <div class="actions" style="margin-top:10px"><a class="btn ghost" href="${fileUrl(videos[0])}?download">Download ${esc(size(videos[0].size))}</a></div>
        ${["done", "failed"].includes(job.status) ? reviewPanel() : ""}
        ${videos.length > 1 ? `<details class="card earlier"><summary>Earlier versions (${videos.length - 1})</summary>
          ${videos.slice(1).map((f, i) => `<div class="ver"><div class="meta">Version ${videos.length - 1 - i} · ${esc(f.name)}</div>
            <video src="${fileUrl(f)}" controls playsinline preload="none"></video>
            <a class="btn ghost small" href="${fileUrl(f)}?download">Download ${esc(size(f.size))}</a></div>`).join("")}</details>` : ""}` : ""}
      ${job.status === "done" && job.message ? `<h2>Notes from Claude</h2><div class="card note">${esc(job.message)}</div>` : ""}
      ${others.length ? `<h2>Other files</h2><div class="card">${others.map((f) => `<div class="file"><a class="name" style="color:var(--accent)" href="${fileUrl(f)}">${esc(f.name)}</a><span class="size">${size(f.size)}</span></div>`).join("")}</div>` : ""}
      <div style="height:14px"></div>`;
    document.getElementById("bottom").innerHTML = `
      ${job.note ? `<h2>Your note</h2><div class="card note">${esc(job.note)}</div>` : ""}
      ${(job.revisions || []).map((r) => `<h2>Round ${r.n + 1} changes</h2><div class="card note">${r.notes.map((n) => `<b class="ts">${clock(n.t)}</b> ${esc(n.text)}`).join("\n")}${r.general ? (r.notes.length ? "\n\n" : "") + esc(r.general) : ""}</div>`).join("")}
      <h2>Sent footage</h2>
      <div class="card">${inputs.map((f) => `<div class="file"><span class="name">${esc(f.name)}</span><span class="size">${f.done ? size(f.size) : "incomplete"}</span></div>`).join("") || `<div class="meta">None</div>`}</div>
      <button class="danger" id="del" style="margin-top:24px;width:100%">Delete job</button>`;
    wireReview(id, revDraft, videos[0], load);
    const retry = document.getElementById("retry");
    if (retry) retry.onclick = async () => { await api(`/api/jobs/${id}/status`, { method: "POST", body: JSON.stringify({ status: "ready", message: "" }) }); load(); };
    document.getElementById("del").onclick = async () => {
      if (!confirm("Delete this job and all its files from the cloud? Files already on the PC stay.")) return;
      await api(`/api/jobs/${id}`, { method: "DELETE" }); route("#/");
    };
    if (BUSY.includes(job.status) || job.status === "uploading") pollTimer = setTimeout(load, 5000);
  };
  load();
}

const clock = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;

function reviewPanel() {
  return `<div class="card review" id="review">
    <div class="title">Want changes?</div>
    <div class="hint" style="margin-top:2px">Pause on the moment, then tap the button. Add as many as you like.</div>
    <button class="ghost" id="addAt" style="width:100%;margin-top:12px">＋ Note at 0:00</button>
    <div id="noteRow" hidden style="margin-top:10px">
      <div class="noterow"><span class="ts" id="noteTs">0:00</span>
        <input id="noteText" type="text" placeholder="e.g. cut this bit, music louder here" autocomplete="off"></div>
      <div class="actions" style="margin-top:8px"><button class="ghost small" id="noteCancel">Cancel</button><button class="primary small" id="noteAdd">Add note</button></div>
    </div>
    <div id="notesList" style="margin-top:8px"></div>
    <textarea id="general" placeholder="Anything else overall? (optional)" style="min-height:70px;margin-top:8px"></textarea>
    <button class="primary" id="sendRev" style="margin-top:10px" disabled>Send changes</button>
    <div class="err" id="revErr" hidden></div>
  </div>`;
}

function wireReview(jobId, draft, latest, reload) {
  const $ = (i) => document.getElementById(i);
  if (!$("review")) return;
  const video = $("mainVideo");
  let pendingT = 0;
  const draw = () => {
    $("notesList").innerHTML = draft.notes.map((n, i) => `<div class="file"><span class="name"><button class="ts seek" data-t="${n.t}">${clock(n.t)}</button> ${esc(n.text)}</span>
      <button class="x" data-i="${i}" aria-label="Remove">×</button></div>`).join("");
    $("notesList").querySelectorAll(".x").forEach((b) => b.addEventListener("click", () => { draft.notes.splice(+b.dataset.i, 1); draw(); }));
    $("notesList").querySelectorAll(".seek").forEach((b) => b.addEventListener("click", () => { video.currentTime = +b.dataset.t; video.pause(); }));
    $("sendRev").disabled = !draft.notes.length && !draft.general.trim();
  };
  const label = () => { $("addAt").textContent = `＋ Note at ${clock(video.currentTime || 0)}`; };
  video.addEventListener("timeupdate", label);
  video.addEventListener("seeked", label);
  $("general").value = draft.general;
  $("general").addEventListener("input", (e) => { draft.general = e.target.value; draw(); });
  $("addAt").addEventListener("click", () => {
    video.pause();
    pendingT = Math.round((video.currentTime || 0) * 10) / 10;
    $("noteTs").textContent = clock(pendingT);
    $("noteRow").hidden = false;
    $("noteText").focus();
  });
  const add = () => {
    const text = $("noteText").value.trim();
    if (!text) return;
    draft.notes.push({ t: pendingT, text });
    draft.notes.sort((a, b) => a.t - b.t);
    $("noteText").value = "";
    $("noteRow").hidden = true;
    draw();
  };
  $("noteAdd").addEventListener("click", add);
  $("noteText").addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
  $("noteCancel").addEventListener("click", () => { $("noteText").value = ""; $("noteRow").hidden = true; });
  $("sendRev").addEventListener("click", async () => {
    $("sendRev").disabled = true;
    $("sendRev").textContent = "Sending…";
    try {
      await api(`/api/jobs/${jobId}/revise`, { method: "POST", body: JSON.stringify({ notes: draft.notes, general: draft.general, video: latest.name }) });
      draft.notes = []; draft.general = "";
      reload();
    } catch (e) {
      $("revErr").textContent = e.message; $("revErr").hidden = false;
      $("sendRev").textContent = "Send changes"; draw();
    }
  });
  label();
  draw();
}

function feedLine(e, jobId) {
  const time = new Date(e.t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  if (e.k === "run") return `<div class="f-run">${esc(e.x)} · ${time}</div>`;
  if (e.k === "img") {
    const [fid, ...rest] = e.x.split("|");
    const src = `/api/jobs/${jobId}/files/${encodeURIComponent(fid)}`;
    return `<div class="f f-img"><span class="f-t">${time}</span><a class="f-x" href="${src}" target="_blank" rel="noopener">
      <img src="${src}" loading="lazy" alt=""><span class="cap">${esc(rest.join("|"))}</span></a></div>`;
  }
  return `<div class="f f-${esc(e.k)}"><span class="f-t">${time}</span><span class="f-x">${esc(e.x)}</span></div>`;
}

window.addEventListener("hashchange", render);
api("/api/me").then(() => render()).catch(() => {});
</script>
